<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS SystemD</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">
  <nav class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">HRMS SystemD</h1>
      <div class="space-x-4">
        <button onclick="showTab('dashboard')" class="hover:text-indigo-200">Dashboard</button>
        <button onclick="shwoTab('leave')" class="hover:text-indigo-200">Leave Management</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6">
    <-- Dashboad Tab -->
    <div id="dashboard" class="tab-content">
      <h2 class="text-2xl font-bold mb-4">Attendance Dashboard</h2>

      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <h3 class="text-lg font-semibold mb-4">Clock In / Out</h3>
        <div class="flex gap-4 items-end">
          <div>
            <label class="block text-sm font-medium text-gray-700">Employee ID</label>
            <select id="clock-emp-id class="mt-1 block w-48 rounded-md border-gray-300 shadow-sm p-2 border"></select>
          </div>
          <button onclick="clockIn()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Clock In</button>
          <button onclick="clockOut()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Clock Out</button>
        </div>
        <p id="clock-message" class="mt-3 text-sm text-gray-600"></p>
      </div>

      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-semibold mb-4">Recent Attendance</h3>
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Clock In</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Clock Out</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
            </tr>
          </thead>
          <tbody id="attendace-table" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>

    <!-- Leave Tab -->
      <div id="leave" class="tab-content hidden">
        <h2 class="text-2xl font-bold mb-4">Leave Management </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
          <div class="bg-white p-6 rounded-lg shadow">
            <h4 class="text-sm font-medium text-gray-500">Medical Leave Balance</h4>
            <p id="balance-medical"  class="text-3xl font-bold text-indigo-600">0</p>
          </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow mb-6">
          <h3 class="text-lg font-semibold mb-4">Request Leave</h3>
          <form id="leave-form" onsubmit="submitLeave(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Employee ID</label>
              <select id="leave-emp-id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Leave Type</label>
              <select id="leave-type" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                <option value="Annual">Annual Leave</option>
                <option value="Medical">Medical Leave</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Start Date</label>
              <input type="date" id="leave-start" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <div>
              <label class ="block text-sm font-medium text-gray-700">End Date</label>
              <input type="date" id="leave-end" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Reason</label>
              <textarea id="leave-reason" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border"></textarea>
            </div>
            <div class="md:col-span-2">
              <button type="submit " class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Submit Request</button>
            </div>
          </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
          <h3 class="text-lg font-semibold mb-4">Leave History</h3>
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Dates</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reason</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
              </tr>
            </thead>
            <tbody id="leave-table" class="bg-white divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
